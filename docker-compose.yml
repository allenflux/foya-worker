services:
  aiapi-stat:
    build: .
    image: foya-worker:local
    restart: unless-stopped
    init: true
    ports:
      - "${FOYA_HTTP_BIND:-0.0.0.0}:${FOYA_PORT:-8080}:8080"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      - aiapi-data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aiapi-data:
